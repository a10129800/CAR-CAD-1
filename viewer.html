<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ CYBER EV HYPERCAR - 3D 智慧極速超跑獨立檢視器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --panel-bg: rgba(10, 14, 23, 0.88);
      --panel-border: rgba(0, 240, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #06080d;
      color: #e2e8f0;
      overflow: hidden;
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    #viewport { flex: 1; height: 100%; position: relative; }
    #canvas-container { width: 100%; height: 100%; }
    #badge {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 20px;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    }
    #badge h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #badge p {
      font-size: 0.78rem;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }
    #sidebar {
      width: 350px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      padding: 22px;
      gap: 16px;
      z-index: 10;
      box-shadow: -8px 0 35px rgba(0, 0, 0, 0.7);
      overflow-y: auto;
    }
    h2 { font-family: 'Orbitron', sans-serif; font-size: 1.05rem; color: #fff; }
    h2 span { color: var(--primary); }
    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .panel-title {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }
    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }
    .color-picker { display: flex; gap: 10px; align-items: center; }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .color-dot:hover { transform: scale(1.18); }
    .color-dot.active { border-color: #fff; box-shadow: 0 0 12px var(--primary-glow); }
    .btn-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    button {
      background: #151d2f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--primary);
      color: #fff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="viewport">
    <div id="canvas-container"></div>
    <div id="badge">
      <h1>⚡ CYBER HYPERCAR 3D</h1>
      <p>360° 空間自由旋轉 (支援底盤仰視) | 滾輪縮放</p>
    </div>
  </div>

  <div id="sidebar">
    <h2>🏎️ CYBER <span>VIEWER</span></h2>

    <div class="panel-section">
      <div class="panel-title">
        <span>💥 空力套件分解爆炸圖</span>
        <span id="explode-val" style="color:var(--primary)">0%</span>
      </div>
      <input type="range" id="explodeRange" min="0" max="100" value="0" oninput="onExplodeChange(this.value)">
    </div>

    <div class="panel-section">
      <div class="panel-title">🎨 超跑車漆</div>
      <div class="color-picker">
        <div class="color-dot active" style="background: #00f0ff;" title="賽博電光青" onclick="setBodyColor(0x00f0ff, this)"></div>
        <div class="color-dot" style="background: #9333ea;" title="離子脈衝紫" onclick="setBodyColor(0x9333ea, this)"></div>
        <div class="color-dot" style="background: #ff0044;" title="極速赤影紅" onclick="setBodyColor(0xff0044, this)"></div>
        <div class="color-dot" style="background: #1e293b;" title="潛行碳纖黑" onclick="setBodyColor(0x1a2130, this)"></div>
        <div class="color-dot" style="background: #00ff88;" title="矩陣毒液綠" onclick="setBodyColor(0x00ff88, this)"></div>
        <div class="color-dot" style="background: #f59e0b;" title="超導流體金" onclick="setBodyColor(0xf59e0b, this)"></div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">⚡ 視角與功能</div>
      <div class="btn-group">
        <button style="border-color:#00f0ff; color:#00f0ff;" onclick="setView('underbody')">🔍 仰視底盤細節</button>
        <button onclick="toggleUnderglow()">🌌 車底霓虹燈</button>
        <button onclick="resetCamera()">🎯 經典超跑視角</button>
        <button onclick="toggleAutoRotate()">🔄 360°巡航旋轉</button>
      </div>
    </div>

    <div style="font-size:0.75rem; color:#94a3b8; font-family:'JetBrains Mono'; line-height:1.5; margin-top:auto;">
      底盤構造：平整化低風阻空力底板、文氏管擴散通道、18650 動力電池艙、前後雙馬達驅動軸
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let autoRotate = false;
    let carGroup, bodyGroup, chassisGroup, aeroGroup, wheelsGroup = [];
    let bodyMaterial, carbonMaterial, glassMaterial, headlightMaterial, taillightMaterial, underglowLight;

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06080d);

      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 2000);
      camera.position.set(180, 110, 195);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 15, 0);

      // ★ 支援完整 360° 仰視看底盤 ★
      controls.maxPolarAngle = Math.PI;

      // 燈光
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
      mainLight.position.set(120, 240, 120);
      mainLight.castShadow = true;
      scene.add(mainLight);

      // 底部仰視專用補光
      const underLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
      underLight.position.set(0, -150, 0);
      scene.add(underLight);

      const cyanRim = new THREE.DirectionalLight(0x00f0ff, 1.0);
      cyanRim.position.set(-160, 80, -160);
      scene.add(cyanRim);

      underglowLight = new THREE.PointLight(0x00f0ff, 3.2, 120);
      underglowLight.position.set(0, 2.5, 0);
      scene.add(underglowLight);

      const grid = new THREE.GridHelper(380, 38, 0x00f0ff, 0x141c2c);
      grid.position.y = -0.05;
      scene.add(grid);

      // 材質
      bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.85, roughness: 0.18 });
      carbonMaterial = new THREE.MeshStandardMaterial({ color: 0x111520, metalness: 0.45, roughness: 0.35 });
      glassMaterial = new THREE.MeshStandardMaterial({ color: 0x050914, metalness: 0.96, roughness: 0.05, transparent: true, opacity: 0.82 });
      headlightMaterial = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 2.0 });
      taillightMaterial = new THREE.MeshStandardMaterial({ color: 0xff0044, emissive: 0xff0044, emissiveIntensity: 2.2 });

      buildCar();

      window.addEventListener('resize', onResize);
      animate();
    }

    function buildCar() {
      carGroup = new THREE.Group();
      scene.add(carGroup);

      // 1. 底盤 (Chassis with Battery & Motors)
      chassisGroup = new THREE.Group();
      const floorShape = new THREE.Shape();
      floorShape.moveTo(70, 28);
      floorShape.quadraticCurveTo(76, 14, 76, 0);
      floorShape.quadraticCurveTo(76, -14, 70, -28);
      floorShape.lineTo(-68, -30);
      floorShape.quadraticCurveTo(-75, 0, -68, 30);
      floorShape.closePath();
      const floorGeo = new THREE.ExtrudeGeometry(floorShape, { depth: 3.2, bevelEnabled: true, bevelSegments: 4, bevelSize: 1.2, bevelThickness: 1.2 });
      floorGeo.rotateX(Math.PI / 2);
      const floorMesh = new THREE.Mesh(floorGeo, carbonMaterial);
      floorMesh.position.y = 7;
      chassisGroup.add(floorMesh);

      // 電池艙與散熱片
      const batPackMesh = new THREE.Mesh(new THREE.BoxGeometry(72, 6, 24), new THREE.MeshStandardMaterial({ color: 0x0a101d }));
      batPackMesh.position.set(0, 8.5, 0);
      chassisGroup.add(batPackMesh);

      for (let r = -30; r <= 30; r += 10) {
        const rib = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 22), new THREE.MeshStandardMaterial({ color: 0x00ff88, metalness: 0.8 }));
        rib.position.set(r, 5.5, 0);
        chassisGroup.add(rib);
      }

      for (let ax of [48, -48]) {
        const motor = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 22, 16), new THREE.MeshStandardMaterial({ color: 0x222e44, metalness: 0.8 }));
        motor.rotation.z = Math.PI / 2;
        motor.position.set(ax, 4.5, 0);
        chassisGroup.add(motor);
      }
      carGroup.add(chassisGroup);

      // 2. 空力套件
      aeroGroup = new THREE.Group();
      const splitterShape = new THREE.Shape();
      splitterShape.moveTo(82, 0);
      splitterShape.quadraticCurveTo(79, 25, 70, 39);
      splitterShape.quadraticCurveTo(65, 41, 62, 38);
      splitterShape.quadraticCurveTo(72, 22, 75, 0);
      splitterShape.quadraticCurveTo(72, -22, 62, -38);
      splitterShape.quadraticCurveTo(65, -41, 70, -39);
      splitterShape.quadraticCurveTo(79, -25, 82, 0);
      const splitterGeo = new THREE.ExtrudeGeometry(splitterShape, { depth: 2.2, bevelEnabled: true, bevelSegments: 4, bevelSize: 1, bevelThickness: 1 });
      splitterGeo.rotateX(Math.PI / 2);
      const splitterMesh = new THREE.Mesh(splitterGeo, carbonMaterial);
      splitterMesh.position.y = 5.5;
      aeroGroup.add(splitterMesh);

      for (let side of [1, -1]) {
        const skirtShape = new THREE.Shape();
        skirtShape.moveTo(35, 0);
        skirtShape.quadraticCurveTo(0, -3, -35, 0);
        skirtShape.lineTo(-35, 4);
        skirtShape.quadraticCurveTo(0, 2, 35, 4);
        skirtShape.closePath();
        const skirtGeo = new THREE.ExtrudeGeometry(skirtShape, { depth: 1.8, bevelEnabled: true, bevelSegments: 3, bevelSize: 0.6, bevelThickness: 0.6 });
        skirtGeo.rotateX(Math.PI / 2);
        const skirtMesh = new THREE.Mesh(skirtGeo, carbonMaterial);
        skirtMesh.position.set(0, 5.8, side * 34.5);
        aeroGroup.add(skirtMesh);
      }

      const diffShape = new THREE.Shape();
      diffShape.moveTo(-55, 28);
      diffShape.quadraticCurveTo(-65, 30, -78, 25);
      diffShape.quadraticCurveTo(-82, 0, -78, -25);
      diffShape.quadraticCurveTo(-65, -30, -55, -28);
      diffShape.closePath();
      const diffGeo = new THREE.ExtrudeGeometry(diffShape, { depth: 2.5, bevelEnabled: true, bevelSegments: 3, bevelSize: 1, bevelThickness: 1 });
      diffGeo.rotateX(Math.PI / 2);
      const diffMesh = new THREE.Mesh(diffGeo, carbonMaterial);
      diffMesh.position.set(0, 7.5, 0);
      diffMesh.rotation.z = -0.12;
      aeroGroup.add(diffMesh);
      carGroup.add(aeroGroup);

      // 3. 車身主體
      bodyGroup = new THREE.Group();
      for (let side of [1, -1]) {
        const fenderShape = new THREE.Shape();
        fenderShape.moveTo(72, 8);
        fenderShape.quadraticCurveTo(62, 19, 48, 19.5);
        fenderShape.quadraticCurveTo(34, 19, 22, 14);
        fenderShape.quadraticCurveTo(32, 10, 36, 6);
        fenderShape.quadraticCurveTo(48, 14, 60, 6);
        fenderShape.closePath();
        const fenderGeo = new THREE.ExtrudeGeometry(fenderShape, { depth: 13, bevelEnabled: true, bevelSegments: 7, bevelSize: 2.8, bevelThickness: 2.8 });
        fenderGeo.computeVertexNormals();
        const fenderMesh = new THREE.Mesh(fenderGeo, bodyMaterial);
        fenderMesh.position.set(0, 0, side === 1 ? 23 : -36);
        bodyGroup.add(fenderMesh);
      }

      const hoodShape = new THREE.Shape();
      hoodShape.moveTo(76, 7);
      hoodShape.quadraticCurveTo(55, 14, 20, 15.5);
      hoodShape.lineTo(20, 10);
      hoodShape.quadraticCurveTo(55, 9, 76, 5);
      hoodShape.closePath();
      const hoodGeo = new THREE.ExtrudeGeometry(hoodShape, { depth: 26, bevelEnabled: true, bevelSegments: 6, bevelSize: 2.0, bevelThickness: 2.0 });
      hoodGeo.computeVertexNormals();
      const hoodMesh = new THREE.Mesh(hoodGeo, bodyMaterial);
      hoodMesh.position.set(0, 0, -13);
      bodyGroup.add(hoodMesh);

      // 座艙
      const sphereGeo = new THREE.SphereGeometry(18, 32, 20);
      const pos = sphereGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        if (y < -2) y = -2;
        let taper = x < 0 ? 1.0 + (x / 30) * 0.48 : 1.0 - (x / 26) * 0.18;
        if (taper < 0.22) taper = 0.22;
        z *= taper;
        x *= 1.8; y *= 0.76; z *= 1.25;
        pos.setXYZ(i, x, y, z);
      }
      sphereGeo.computeVertexNormals();
      const canopyMesh = new THREE.Mesh(sphereGeo, glassMaterial);
      canopyMesh.position.set(-6, 17.5, 0);
      bodyGroup.add(canopyMesh);

      // 後輪拱
      for (let side of [1, -1]) {
        const rearShape = new THREE.Shape();
        rearShape.moveTo(-20, 13);
        rearShape.quadraticCurveTo(-46, 21, -74, 15);
        rearShape.quadraticCurveTo(-72, 7, -62, 6);
        rearShape.quadraticCurveTo(-48, 14, -36, 6);
        rearShape.quadraticCurveTo(-26, 7, -20, 13);
        rearShape.closePath();
        const rearGeo = new THREE.ExtrudeGeometry(rearShape, { depth: 15, bevelEnabled: true, bevelSegments: 7, bevelSize: 2.8, bevelThickness: 2.8 });
        rearGeo.computeVertexNormals();
        const rearMesh = new THREE.Mesh(rearGeo, bodyMaterial);
        rearMesh.position.set(0, 0, side === 1 ? 23 : -38);
        bodyGroup.add(rearMesh);
      }

      // ★ 後引擎艙蓋與中央流暢封閉甲板 ★
      const deckShape = new THREE.Shape();
      deckShape.moveTo(-18, 15);
      deckShape.quadraticCurveTo(-44, 17.5, -72, 14.5);
      deckShape.lineTo(-72, 7.5);
      deckShape.quadraticCurveTo(-44, 7.5, -18, 7.5);
      deckShape.closePath();
      const deckGeo = new THREE.ExtrudeGeometry(deckShape, { depth: 28, bevelEnabled: true, bevelSegments: 4, bevelSize: 1.5, bevelThickness: 1.5 });
      deckGeo.computeVertexNormals();
      const deckMesh = new THREE.Mesh(deckGeo, bodyMaterial);
      deckMesh.position.set(0, 0, -14);
      bodyGroup.add(deckMesh);

      // 尾燈
      const tailMesh = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.5, 68), taillightMaterial);
      tailMesh.position.set(-71, 14.5, 0);
      bodyGroup.add(tailMesh);

      // ★ 尾翼支柱與主翼板 (緊密安裝，絕不脫節) ★
      for (let side of [1, -1]) {
        const pylonShape = new THREE.Shape();
        pylonShape.moveTo(-54, 15.5);
        pylonShape.quadraticCurveTo(-60, 24, -68, 28.5);
        pylonShape.lineTo(-72, 28.5);
        pylonShape.quadraticCurveTo(-66, 21, -60, 15.5);
        pylonShape.closePath();
        const pylonGeo = new THREE.ExtrudeGeometry(pylonShape, { depth: 2.2, bevelEnabled: true, bevelSegments: 2, bevelSize: 0.4, bevelThickness: 0.4 });
        const pylonMesh = new THREE.Mesh(pylonGeo, carbonMaterial);
        pylonMesh.position.set(0, 0, side * 18 - 1.1);
        bodyGroup.add(pylonMesh);
      }

      const wingAirfoil = new THREE.Shape();
      wingAirfoil.moveTo(7, 0);
      wingAirfoil.quadraticCurveTo(0, 2.0, -10, 1.4);
      wingAirfoil.quadraticCurveTo(-14, 0.6, -15, 0);
      wingAirfoil.quadraticCurveTo(-10, -0.6, 0, -1.0);
      wingAirfoil.quadraticCurveTo(4, -0.8, 7, 0);
      const wingGeo = new THREE.ExtrudeGeometry(wingAirfoil, { depth: 76, bevelEnabled: true, bevelSegments: 3, bevelSize: 0.8, bevelThickness: 0.8 });
      const wingMesh = new THREE.Mesh(wingGeo, carbonMaterial);
      wingMesh.position.set(-66, 29, -38);
      wingMesh.rotation.z = -0.06;
      bodyGroup.add(wingMesh);

      carGroup.add(bodyGroup);

      // 4. 車輪
      const wheelPos = [
        { x: 48, z: 38, isLeft: true },
        { x: 48, z: -38, isLeft: false },
        { x: -48, z: 38, isLeft: true },
        { x: -48, z: -38, isLeft: false }
      ];
      wheelsGroup = [];
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x090c12, roughness: 0.88 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xe0e8f5, metalness: 0.92, roughness: 0.15 });

      for (let p of wheelPos) {
        const w = new THREE.Group();
        w.userData = { origX: p.x, origZ: p.z, isLeft: p.isLeft };

        const tire = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 13.5, 28), tireMat);
        tire.rotation.x = Math.PI / 2;
        w.add(tire);

        const rim = new THREE.Mesh(new THREE.CylinderGeometry(13, 13, 14, 20), rimMat);
        rim.rotation.x = Math.PI / 2;
        w.add(rim);

        w.position.set(p.x, 16.5, p.z);
        carGroup.add(w);
        wheelsGroup.push(w);
      }
    }

    function onExplodeChange(val) {
      const p = val / 100;
      document.getElementById('explode-val').innerText = val + '%';
      bodyGroup.position.y = p * 54;
      aeroGroup.position.y = -p * 18;
      for (let w of wheelsGroup) {
        const offset = (w.userData.isLeft ? 1 : -1) * p * 38;
        w.position.z = w.userData.origZ + offset;
      }
      chassisGroup.position.y = -p * 26;
    }

    function setBodyColor(hex, el) {
      bodyMaterial.color.setHex(hex);
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      if (el) el.classList.add('active');
      underglowLight.color.setHex(hex);
      headlightMaterial.color.setHex(hex);
      headlightMaterial.emissive.setHex(hex);
    }

    function toggleUnderglow() {
      underglowLight.intensity = underglowLight.intensity > 0 ? 0 : 3.2;
    }

    function toggleAutoRotate() { autoRotate = !autoRotate; }

    function resetCamera() {
      camera.position.set(180, 110, 195);
      controls.target.set(0, 15, 0);
    }

    function setView(v) {
      if (v === 'underbody') {
        camera.position.set(110, -85, 140);
      } else if (v === 'top') {
        camera.position.set(0, 260, 0);
      }
      controls.target.set(0, 15, 0);
    }

    function onResize() {
      const c = document.getElementById('canvas-container');
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(c.clientWidth, c.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && carGroup) carGroup.rotation.y += 0.007;
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
